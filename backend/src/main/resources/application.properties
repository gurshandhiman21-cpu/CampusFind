# =============================================================================
# CampusFind Backend Configuration - Phase 5 Database Integration
# =============================================================================

# Server HTTP Port
server.port=8080

# Application Name
spring.application.name=campusfind-backend

# DataSource Configuration (MySQL 8.0)
# Uses database name 'campusfind' on localhost:3306.
# Credentials are provided via environment variables DB_USERNAME and DB_PASSWORD.
# DB_USERNAME defaults to 'root' if unset. DB_PASSWORD has no default and must not be hardcoded.
spring.datasource.url=jdbc:mysql://localhost:3306/campusfind?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Explicitly declare MySQLDialect for MySQL 8.0+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ddl-auto=validate verifies that the existing database schema strictly conforms
# to JPA entity mappings without creating, altering, or dropping tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload & Storage Configuration
campusfind.upload.dir=uploads/images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
